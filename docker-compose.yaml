version: '3.9'

services:
  application_telegram:
    container_name: smotra_bot
    build:
      context: ./application_telegram
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_TOKEN=${BOT_TOKEN}
      - DATABASE_LOGIN=${DB_LOGIN}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_IP=${DB_IP}
      - DATABASE_NAME=${DB_NAME}
